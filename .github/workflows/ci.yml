name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The 738-test Playwright campaign is a local pre-release gate. CI stays
    # intentionally lean so browser installation and quota cannot delay a push.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The MCP server is its own package (powernote-mcp/package.json owns
      # `ws`); the root install never touches it, and test:bridge imports it.
      - run: npm ci --prefix powernote-mcp

      - run: npx tsc -b --noEmit

      - run: npx eslint src --ext .ts,.tsx --max-warnings 9999

      # Ensure the committed release artifact can be reproduced.
      - run: npm run build:template

      - run: npm test --prefix powernote-mcp
      - run: npm run test:bridge
