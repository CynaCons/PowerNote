name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # v0.60/v0.61.1 runs hung 6h in "playwright install --with-deps" (apt).
    # Fail fast instead; green runs take ~7 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The MCP server is its own package (powernote-mcp/package.json owns
      # `ws`); the root install never touches it, and test:bridge imports it.
      - run: npm ci --prefix powernote-mcp

      - run: npx tsc -b --noEmit

      - run: npx eslint src --ext .ts,.tsx --max-warnings 9999

      # Built BEFORE the tests, because 131-upgrade-regression loads this exact
      # artifact. Testing a stale one would gate nothing.
      - run: npm run build:template

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # The Playwright suite drives the app side of the bridge and never starts
      # the MCP server, so the hub/peer topology has no coverage there.
      - run: npm run test:bridge
